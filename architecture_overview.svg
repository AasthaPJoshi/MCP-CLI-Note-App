<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>MCP CLI Note App - Architecture Overview</title>
<desc>Structural diagram showing the three-layer architecture: User CLI, Core layer, MCP Client/Server, and Anthropic API</desc>

<style>
  text { font-family: Arial, sans-serif; }
  .title { font-size: 14px; font-weight: 600; }
  .sub { font-size: 12px; }
  .label { font-size: 11px; }
</style>

<!-- Background -->
<rect width="680" height="480" fill="#ffffff"/>

<!-- User layer -->
<rect x="240" y="20" width="200" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text class="title" x="340" y="42" text-anchor="middle" fill="#085041">User (terminal)</text>
<text class="sub" x="340" y="60" text-anchor="middle" fill="#0f6e56">types commands, @docs, /prompts</text>

<!-- Arrow down -->
<line x1="340" y1="72" x2="340" y2="108" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="340" y1="108" x2="340" y2="72" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- Core layer container -->
<rect x="60" y="112" width="560" height="168" rx="14" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 4"/>
<text class="label" x="80" y="130" fill="#666">core/ — application layer</text>

<!-- CliApp -->
<rect x="82" y="140" width="140" height="52" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
<text class="title" x="152" y="161" text-anchor="middle" fill="#3c3489">CliApp</text>
<text class="sub" x="152" y="178" text-anchor="middle" fill="#534ab7">prompt-toolkit UI, tab-complete</text>

<!-- CliChat -->
<rect x="270" y="140" width="140" height="52" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
<text class="title" x="340" y="161" text-anchor="middle" fill="#3c3489">CliChat</text>
<text class="sub" x="340" y="178" text-anchor="middle" fill="#534ab7">@doc mentions, /command routing</text>

<!-- Chat -->
<rect x="458" y="140" width="140" height="52" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
<text class="title" x="528" y="161" text-anchor="middle" fill="#3c3489">Chat + ToolManager</text>
<text class="sub" x="528" y="178" text-anchor="middle" fill="#534ab7">agentic loop, tool dispatch</text>

<!-- Claude service -->
<rect x="270" y="214" width="140" height="44" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text class="title" x="340" y="240" text-anchor="middle" fill="#2c2c2a">Claude service</text>

<!-- horizontal arrows -->
<line x1="222" y1="166" x2="268" y2="166" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="410" y1="166" x2="456" y2="166" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="340" y1="192" x2="340" y2="212" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- Arrows down to bottom row -->
<line x1="152" y1="282" x2="152" y2="338" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="152" y1="338" x2="152" y2="282" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="528" y1="282" x2="528" y2="338" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- MCP Client -->
<rect x="60" y="338" width="190" height="56" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text class="title" x="155" y="360" text-anchor="middle" fill="#711b13">MCPClient</text>
<text class="sub" x="155" y="378" text-anchor="middle" fill="#993c1d">stdio transport, session</text>

<!-- stdio label -->
<text class="label" x="259" y="358" text-anchor="middle" fill="#555">stdio</text>
<line x1="250" y1="366" x2="268" y2="366" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="268" y1="374" x2="250" y2="374" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- MCP Server -->
<rect x="270" y="338" width="190" height="56" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text class="title" x="365" y="360" text-anchor="middle" fill="#711b13">FastMCP Server</text>
<text class="sub" x="365" y="378" text-anchor="middle" fill="#993c1d">tools, resources, prompts</text>

<!-- Anthropic API -->
<rect x="470" y="338" width="170" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.8"/>
<text class="title" x="555" y="360" text-anchor="middle" fill="#0c447c">Anthropic API</text>
<text class="sub" x="555" y="378" text-anchor="middle" fill="#185fa5">claude-sonnet-4-5</text>

<!-- MCP Inspector -->
<rect x="60" y="418" width="190" height="40" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.8"/>
<text class="title" x="155" y="442" text-anchor="middle" fill="#173404">MCP Inspector</text>
<line x1="155" y1="394" x2="155" y2="416" stroke="#3b6d11" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
<text class="label" x="262" y="442" fill="#444">debug / test tools</text>

<!-- Arrow markers -->
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#3b6d11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
</svg>
